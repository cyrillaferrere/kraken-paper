# Site statique, sans framework. Le build ne fait qu ecrire site/version.json s il manque. Les donnees sont lues sur GitHub (API),
# donc pas besoin de redeployer a chaque cycle du moteur.
[build]
  publish = "site"
  command = "sh scripts/netlify-build.sh"
  # Ne construit que si site/ ou netlify.toml change (economise les minutes Netlify).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify.toml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
