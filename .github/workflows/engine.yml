name: engine

on:
  schedule:
    - cron: '7 * * * *'   # secours ; le déclencheur principal (v0.2.0) est la fonction Netlify, minute 9 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['decisions/**']

permissions:
  contents: write

concurrency:
  group: kraken-paper-engine
  cancel-in-progress: false

jobs:
  cycle:
    # Le moteur ne tourne que depuis main (le cron GitHub ne part déjà que de la branche par défaut ;
    # ce garde-fou bloque aussi un lancement manuel depuis preprod ou une branche feature).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # toujours le dernier etat, pas le commit de declenchement
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests (sans reseau)
        run: python -m unittest -v
      - name: Début du journal du cycle
        id: journal_start
        shell: bash
        run: |
          if [ -f state/journal.jsonl ]; then
            echo "offset=$(wc -c < state/journal.jsonl | tr -d ' ')" >> "$GITHUB_OUTPUT"
          else
            echo "offset=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Cycle moteur (PAPER, API publique uniquement)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TZ: Europe/Paris
        run: python engine/run.py
      - name: Commit de l'etat
        env:
          TZ: Europe/Paris
        run: |
          git config user.name "kraken-paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then echo "rien a committer"; exit 0; fi
          git commit -m "chore: cycle $(date '+%Y-%m-%d %H:%M %Z')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
      - name: Notification Grok Bot (après commit/push, une requête groupée)
        env:
          JOURNAL_OFFSET: ${{ steps.journal_start.outputs.offset }}
          GROKBOT_WEBHOOK_URL: ${{ secrets.GROKBOT_WEBHOOK_URL }}
          GROKBOT_WEBHOOK_KEY: ${{ secrets.GROKBOT_WEBHOOK_KEY }}
        run: python scripts/notify_grokbot.py
