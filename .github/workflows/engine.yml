name: engine

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['decisions/**']

permissions:
  contents: write

concurrency:
  group: kraken-paper-engine
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests (sans reseau)
        run: python -m unittest -v
      - name: Cycle moteur (PAPER, API publique uniquement)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TZ: Europe/Paris
        run: python engine/run.py
      - name: Commit de l'etat
        env:
          TZ: Europe/Paris
        run: |
          git config user.name "kraken-paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then echo "rien a committer"; exit 0; fi
          git commit -m "chore: cycle $(date '+%Y-%m-%d %H:%M %Z')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
