name: release-candidate-isolated-check
on:
  pull_request:
    branches: [release/v0.3.1-ci-target]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify protected files unchanged from main snapshot
        run: |
          set -euo pipefail
          git fetch origin main
          ! git diff --name-only origin/main...HEAD | grep -E '^(state|decisions)/'
          ! git diff --name-only origin/main...HEAD | grep -E '^.github/workflows/'
          test "$(tr -d '[:space:]' < VERSION)" = "0.3.1"
      - name: Python engine tests
        run: python3 -m unittest -q
      - name: Site tests
        run: node --test tests/site/*.test.js
      - name: Functions tests
        run: node --test tests/functions/*.test.mjs
      - name: Shell syntax
        run: bash -n scripts/deploy.sh scripts/release.sh
